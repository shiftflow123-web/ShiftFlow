<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shift Flow</title>
    <meta name="theme-color" content="#edf4ff" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="light">
    <div class="app-shell">
      <div id="themeReveal" class="theme-reveal" aria-hidden="true"></div>

      <header class="topbar glass-panel">
        <div class="brand">
          <div class="logo-wrap" aria-label="Shift Flow logo">
            <svg class="logo-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shift Flow logo">
              <defs>
                <linearGradient id="logoGradient" x1="0%" x2="100%" y1="0%" y2="100%">
                  <stop offset="0%" stop-color="#bfe9ff" />
                  <stop offset="35%" stop-color="#a9c9ff" />
                  <stop offset="65%" stop-color="#9090ff" />
                  <stop offset="100%" stop-color="#7fe7d3" />
                </linearGradient>
              </defs>
              <rect x="14" y="14" width="92" height="92" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.52)" />
              <path d="M35 64C46 49 58 40 75 40C85 40 91 43 95 48C89 44 82 42 75 42C58 42 48 51 43 64C40 72 38 80 35 87C31 80 30 71 35 64Z" fill="url(#logoGradient)" opacity="0.92"/>
              <circle cx="60" cy="62" r="24" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
              <path d="M60 62V46" stroke="rgba(255,255,255,0.92)" stroke-width="3" stroke-linecap="round"/>
              <path d="M60 62L71 69" stroke="rgba(255,255,255,0.92)" stroke-width="3" stroke-linecap="round"/>
              <circle cx="60" cy="62" r="5" fill="rgba(255,255,255,0.92)"/>
              <path d="M18 86C30 71 39 63 52 57" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round" fill="none"/>
            </svg>
          </div>

          <div class="brand-copy">
            <h1>Shift Flow</h1>
            <p class="tagline">Твой поток смен — под контролем</p>
          </div>
        </div>

        <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Переключить тему">
          <span class="theme-icon">☀️</span>
        </button>
      </header>

      <main id="page-main" class="page-view active">
        <section class="panel main-panel">
          <div class="section-header row-between">
            <button id="prevMonth" class="icon-btn" type="button" aria-label="Предыдущий месяц">‹</button>
            <h2 id="monthLabel">Месяц</h2>
            <div class="header-actions">
              <button id="graphPresetBtn" class="icon-btn graph-btn" type="button" aria-label="Показать шаблон графика">▦</button>
              <button id="nextMonth" class="icon-btn" type="button" aria-label="Следующий месяц">›</button>
            </div>
          </div>

          <div class="calendar-weekdays">
            <span>Пн</span>
            <span>Вт</span>
            <span>Ср</span>
            <span>Чт</span>
            <span>Пт</span>
            <span>Сб</span>
            <span>Вс</span>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>

          <div id="mainStats" class="stats-grid"></div>
        </section>
      </main>

      <main id="page-reports" class="page-view hidden">
        <section class="panel report-panel">
          <div class="section-header row-between">
            <button id="reportPrevYear" class="icon-btn" type="button" aria-label="Предыдущий год">‹</button>
            <h2 id="reportYearLabel">2026</h2>
            <button id="reportNextYear" class="icon-btn" type="button" aria-label="Следующий год">›</button>
          </div>

          <div id="reportMonthCards" class="report-month-list"></div>

          <div class="chart-card glass-panel">
            <div class="chart-header">
              <h3>Доходы по месяцам</h3>
            </div>
            <div id="incomeChart" class="income-chart"></div>
          </div>

          <div class="year-summary glass-panel sticky-year-summary">
            <div class="year-summary-head">
              <span>Итог по году</span>
              <strong id="yearSummaryTitle">2026</strong>
            </div>
            <div id="yearSummary" class="year-summary-grid"></div>
          </div>
        </section>
      </main>

      <main id="page-settings" class="page-view hidden">
        <section class="panel settings-panel">
          <div class="section-header row-between">
            <h2>Работы</h2>
            <button id="addWorkBtn" class="chip-btn" type="button">+ Добавить</button>
          </div>
          <div id="worksList" class="works-list"></div>
        </section>
      </main>
    </div>

    <nav class="tabbar glass-panel" aria-label="Навигация"><div class="tab-indicator"></div>
      <button class="tab-item active" data-tab="main" type="button">
        <span class="tab-icon">⌂</span>
        <span class="tab-text">Главная</span>
      </button>
      <button class="tab-item" data-tab="reports" type="button">
        <span class="tab-icon">◫</span>
        <span class="tab-text">Отчёты</span>
      </button>
      <button class="tab-item" data-tab="settings" type="button">
        <span class="tab-icon">⚙</span>
        <span class="tab-text">Настройки</span>
      </button>
    </nav>

    <div id="sheetBackdrop" class="sheet-backdrop hidden" aria-hidden="true"></div>

    <aside id="shiftSheet" class="bottom-sheet hidden" aria-hidden="true">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <h3 id="sheetTitle">Добавить смену</h3>
        <button class="close-btn" id="closeShiftSheet" type="button" aria-label="Закрыть">×</button>
      </div>

      <div class="sheet-body">
        <label>
          <span>Работа</span>
          <select id="shiftWorkSelect"></select>
        </label>

        <div id="hourlyFields" class="sheet-fields">
          <label>
            <span>Часов за смену</span>
            <input id="shiftHoursInput" type="number" min="0" step="0.5" value="8" />
          </label>
          <div class="inline-metric">
            <span>Доход</span>
            <strong id="liveIncomeValue">0 ₽</strong>
          </div>
        </div>

        <div id="fixedFields" class="sheet-fields hidden">
          <button id="fixedShiftBtn" class="primary-btn wide" type="button">Добавить смену</button>
          <button id="weekendBtn" class="secondary-btn wide" type="button">Выходной</button>
        </div>
      </div>
    </aside>

    <aside id="graphSheet" class="bottom-sheet hidden" aria-hidden="true">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-header">
        <h3>График</h3>
        <button class="close-btn" id="closeGraphSheet" type="button" aria-label="Закрыть">×</button>
      </div>

      <div class="sheet-body graph-sheet-body">
        <label>
          <span>Место работы</span>
          <select id="graphWorkSelect"></select>
        </label>

        <div class="preset-grid">
          <button class="preset-btn active" data-preset="2/2" type="button">2/2</button>
          <button class="preset-btn" data-preset="3/3" type="button">3/3</button>
          <button class="preset-btn" data-preset="4/3" type="button">4/3</button>
          <button class="preset-btn" data-preset="5/2" type="button">5/2</button>
          <button class="preset-btn wide" data-preset="custom" type="button">Свой вариант</button>
        </div>

        <div id="customConfig" class="custom-config hidden">
          <div class="stepper-row">
            <label>
              <span>Смен подряд</span>
              <input id="shiftSequenceInput" type="number" min="1" max="14" value="3" />
            </label>
            <label>
              <span>Выходных подряд</span>
              <input id="restSequenceInput" type="number" min="1" max="14" value="2" />
            </label>
          </div>
        </div>

        <label>
          <span>Начиная с даты</span>
          <input id="graphStartDate" type="date" />
        </label>

        <div class="segmented-row">
          <span>Заполнить</span>
          <div class="segmented-control">
            <button class="segment-btn active" data-fill="month" type="button">До конца месяца</button>
            <button class="segment-btn" data-fill="week" type="button">До конца недели</button>
          </div>
        </div>

        <label>
          <span>Часов за смену</span>
          <input id="graphHoursInput" type="number" min="1" step="0.5" value="8" />
        </label>

        <button id="applyGraphBtn" class="primary-btn wide" type="button">Применить</button>
      </div>
    </aside>

    <script src="app.js"></script>
  </body>
</html>
