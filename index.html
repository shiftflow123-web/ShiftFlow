<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shift Flow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="logo-wrap" aria-label="Shift Flow logo">
            <svg class="logo-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shift Flow logo">
              <defs>
                <linearGradient id="logoGradient" x1="0%" x2="100%" y1="0%" y2="100%">
                  <stop offset="0%" stop-color="#B9E7FF"/>
                  <stop offset="35%" stop-color="#9DC7FF"/>
                  <stop offset="65%" stop-color="#8E8CFF"/>
                  <stop offset="100%" stop-color="#6FE3C2"/>
                </linearGradient>
              </defs>
              <rect x="14" y="14" width="92" height="92" rx="28" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.5)"/>
              <path d="M35 64C46 49 58 40 75 40C85 40 91 43 95 48C89 44 82 42 75 42C58 42 48 51 43 64C40 72 38 80 35 87C31 80 30 71 35 64Z" fill="url(#logoGradient)" opacity="0.9"/>
              <circle cx="60" cy="62" r="24" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
              <path d="M60 62V46" stroke="rgba(255,255,255,0.92)" stroke-width="3" stroke-linecap="round"/>
              <path d="M60 62L71 69" stroke="rgba(255,255,255,0.92)" stroke-width="3" stroke-linecap="round"/>
              <circle cx="60" cy="62" r="5" fill="rgba(255,255,255,0.92)"/>
              <path d="M18 86C30 71 39 63 52 57" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round" fill="none"/>
            </svg>
          </div>

          <div class="brand-copy">
            <h1>Shift Flow</h1>
            <p class="tagline">Твой поток смен — под контролем</p>
          </div>
        </div>
      </header>

      <main class="page" id="mainPage">
        <section class="calendar-panel glass-panel">
          <div class="calendar-header">
            <button id="prevMonth" class="icon-btn" type="button" aria-label="Предыдущий месяц">‹</button>
            <h2 id="monthLabel">Месяц</h2>
            <button id="nextMonth" class="icon-btn" type="button" aria-label="Следующий месяц">›</button>
          </div>

          <div class="calendar-weekdays">
            <span>Пн</span>
            <span>Вт</span>
            <span>Ср</span>
            <span>Чт</span>
            <span>Пт</span>
            <span>Сб</span>
            <span>Вс</span>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>
        </section>

        <section class="stats">
          <article class="stat-card glass-panel">
            <div class="stat-head">
              <div class="stat-icon stat-clock" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="8.5"/>
                  <path d="M12 7v5l3.5 2.2"/>
                </svg>
              </div>
              <span class="stat-label">Часы</span>
            </div>
            <strong id="totalHours">0</strong>
          </article>

          <article class="stat-card glass-panel">
            <div class="stat-head">
              <div class="stat-icon stat-shifts" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3.5" y="5" width="17" height="15.5" rx="3"/>
                  <path d="M8 3.5v3M16 3.5v3M3.5 9.5h17"/>
                  <path d="M8.5 13.5h2.5v2.5H8.5zm4 0h2.5v2.5h-2.5z"/>
                </svg>
              </div>
              <span class="stat-label">Смены</span>
            </div>
            <strong id="totalShifts">0</strong>
          </article>

          <article class="stat-card glass-panel">
            <div class="stat-head">
              <div class="stat-icon stat-income" aria-hidden="true">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="13.5" r="5.5"/>
                  <path d="M14.5 6.5h1.8A2.7 2.7 0 0 1 19 9.2v.8"/>
                  <path d="M8 8.8V7.2A2.2 2.2 0 0 1 10.2 5h2.6A2.2 2.2 0 0 1 15 7.2v1.6"/>
                  <path d="M6 18.5h12"/>
                </svg>
              </div>
              <span class="stat-label">Доход</span>
            </div>
            <strong id="totalIncome">0 ₽</strong>
          </article>
        </section>
      </main>

      <main class="page hidden" id="reportsPage">
        <section class="report-panel glass-panel">
          <div class="report-header">
            <button id="reportPrevMonth" class="icon-btn" type="button">‹</button>
            <h2 id="reportMonthLabel">Месяц</h2>
            <button id="reportNextMonth" class="icon-btn" type="button">›</button>
          </div>
          <div id="reportSummary" class="report-summary"></div>
        </section>
      </main>

      <main class="page hidden" id="settingsPage">
        <section class="settings-panel glass-panel">
          <div class="settings-block">
            <h3>Настройки</h3>
            <div class="settings-row compact-row">
              <button class="mode-btn active" data-lang="ru" type="button">RU</button>
              <button class="mode-btn" data-lang="en" type="button">EN</button>
            </div>
          </div>

          <div class="settings-block">
            <div class="settings-row compact-row">
              <button class="mode-btn active" data-theme="light" type="button">Светлая</button>
              <button class="mode-btn" data-theme="dark" type="button">Тёмная</button>
            </div>
          </div>

          <div class="settings-block">
            <h3>Параметры</h3>
            <div class="settings-fields">
              <label class="field">
                <span>Ставка за час</span>
                <input type="number" id="hourRate" min="0" step="1" placeholder="300" />
              </label>
            </div>
          </div>
        </section>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="Нижняя навигация">
      <button class="bottom-nav-link active" data-page="main" type="button">Главная</button>
      <button class="bottom-nav-link" data-page="reports" type="button">Отчёты</button>
      <button class="bottom-nav-link" data-page="settings" type="button">Настройки</button>
    </nav>

    <div id="shiftModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card glass-panel">
        <div class="modal-header">
          <h3 id="modalDateLabel">Дата</h3>
          <button class="close-btn" id="closeModalBtn" aria-label="Закрыть">×</button>
        </div>

        <form id="shiftForm">
          <label>
            <span>Наименование смены</span>
            <input type="text" id="shiftName" placeholder="Ночная смена" />
          </label>

          <label>
            <span>Количество часов</span>
            <input type="number" id="shiftHours" min="0" step="0.5" />
          </label>

          <label>
            <span>Доход</span>
            <input type="number" id="shiftIncome" min="0" step="1" />
          </label>

          <label class="checkbox-row">
            <input type="checkbox" id="isWeekend" />
            <span>Выходной день</span>
          </label>

          <div class="modal-actions">
            <button type="button" id="deleteShiftBtn" class="danger-btn hidden">Удалить смену</button>
            <button type="submit" class="primary-btn">Сохранить</button>
          </div>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
