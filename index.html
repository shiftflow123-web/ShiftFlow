<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShiftFlow</title>
    <meta name="theme-color" content="#0d1022" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar glass-panel">
        <div class="brand-block">
          <div class="brand-mark">SF</div>
          <div>
            <div class="eyebrow">ShiftFlow</div>
            <h1>Учёт смен</h1>
          </div>
        </div>

        <button id="openGraphSheet" class="graph-fab" type="button" aria-label="График">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="2"></rect>
            <rect x="14" y="3" width="7" height="4" rx="2"></rect>
            <rect x="14" y="11" width="7" height="10" rx="2"></rect>
            <rect x="3" y="12" width="7" height="9" rx="2"></rect>
          </svg>
        </button>
      </header>

      <main class="page active" id="mainPage">
        <section class="kpi-strip">
          <article class="kpi glass-panel">
            <span class="kpi-label">Доход</span>
            <strong id="sumIncome">0 ₽</strong>
          </article>
          <article class="kpi glass-panel">
            <span class="kpi-label">Смены</span>
            <strong id="sumShifts">0</strong>
          </article>
          <article class="kpi glass-panel">
            <span class="kpi-label">Часы</span>
            <strong id="sumHours">0</strong>
          </article>
        </section>

        <section class="calendar-card glass-panel">
          <div class="section-head">
            <button class="nav-chevron" id="prevMonthBtn" type="button" aria-label="Предыдущий месяц">‹</button>
            <h2 id="monthLabel">Месяц</h2>
            <button class="nav-chevron" id="nextMonthBtn" type="button" aria-label="Следующий месяц">›</button>
          </div>
          <div class="weekdays">
            <span>Пн</span>
            <span>Вт</span>
            <span>Ср</span>
            <span>Чт</span>
            <span>Пт</span>
            <span>Сб</span>
            <span>Вс</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>

        <section class="work-grid-wrap">
          <div class="section-head compact">
            <h3>Работы</h3>
            <button class="ghost-btn" id="addShiftQuick" type="button">+ смена</button>
          </div>
          <div id="workGrid" class="work-grid"></div>
        </section>
      </main>

      <main class="page" id="reportsPage">
        <section class="report-panel glass-panel">
          <div class="section-head">
            <h2>Отчёты</h2>
          </div>
          <div id="reportList" class="report-list"></div>
        </section>

        <section class="year-panel glass-panel">
          <div class="section-head">
            <button class="nav-chevron" id="prevYearBtn" type="button">‹</button>
            <h2 id="yearLabelReports">2026</h2>
            <button class="nav-chevron" id="nextYearBtn" type="button">›</button>
          </div>
          <div class="year-chart" id="yearChart"></div>
          <div class="year-total-row">
            <span>Итог за год</span>
            <strong id="yearTotalValue">0 ₽</strong>
          </div>
        </section>
      </main>

      <main class="page" id="settingsPage">
        <section class="settings-panel glass-panel">
          <div class="section-head compact">
            <h2>Работы</h2>
            <button class="ghost-btn" id="addWorkBtn" type="button">+ работа</button>
          </div>
          <div id="settingsList" class="settings-list"></div>
        </section>
      </main>
    </div>

    <nav class="tab-bar glass-panel" aria-label="Навигация по вкладкам">
      <button class="tab-button active" data-page="main" type="button">
        <span class="tab-icon home">⌂</span>
        <span>Главная</span>
      </button>
      <button class="tab-button" data-page="reports" type="button">
        <span class="tab-icon">▣</span>
        <span>Отчёты</span>
      </button>
      <button class="tab-button" data-page="settings" type="button">
        <span class="tab-icon">⚙</span>
        <span>Настройки</span>
      </button>
    </nav>

    <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>

    <aside id="shiftSheet" class="bottom-sheet hidden" aria-hidden="true">
      <div class="sheet-grab"></div>
      <div class="sheet-header">
        <div>
          <div class="eyebrow">Смена</div>
          <h3 id="sheetTitle">Ночная смена</h3>
        </div>
        <button class="close-sheet" id="closeShiftSheet" type="button" aria-label="Закрыть">×</button>
      </div>

      <div class="sheet-body">
        <div class="segmented" id="rateModeToggle">
          <button class="segment active" data-mode="hourly" type="button">Почасовая</button>
          <button class="segment" data-mode="fixed" type="button">Фиксированная</button>
        </div>

        <label class="field">
          <span>Дата</span>
          <input id="sheetDate" type="date" />
        </label>

        <div id="hourlyFields">
          <label class="field">
            <span>Часов</span>
            <input id="sheetHours" type="number" min="0" step="0.5" value="8" />
          </label>
          <label class="field">
            <span>Ставка</span>
            <input id="sheetRate" type="number" min="0" step="50" value="400" />
          </label>
          <div class="live-row">
            <span>Live доход</span>
            <strong id="sheetIncomePreview">0 ₽</strong>
          </div>
        </div>

        <div id="fixedFields" class="hidden">
          <div class="fixed-actions">
            <button class="primary-btn" id="addFixedShift" type="button">Добавить смену</button>
            <button class="secondary-btn" id="markWeekend" type="button">Выходной</button>
          </div>
        </div>

        <button class="primary-action" id="saveShiftBtn" type="button">Сохранить</button>
      </div>
    </aside>

    <aside id="graphSheet" class="bottom-sheet hidden" aria-hidden="true">
      <div class="sheet-grab"></div>
      <div class="sheet-header">
        <div>
          <div class="eyebrow">График</div>
          <h3>Подготовка смен</h3>
        </div>
        <button class="close-sheet" id="closeGraphSheet" type="button" aria-label="Закрыть">×</button>
      </div>

      <div class="sheet-body graph-sheet-body">
        <div class="segmented" id="workSelector">
          <button class="segment active" data-work-id="all" type="button">Все</button>
        </div>

        <div class="preset-grid">
          <button class="preset-btn active" data-preset="2/2" type="button">2/2</button>
          <button class="preset-btn" data-preset="3/3" type="button">3/3</button>
          <button class="preset-btn" data-preset="4/3" type="button">4/3</button>
          <button class="preset-btn" data-preset="5/2" type="button">5/2</button>
          <button class="preset-btn" data-preset="custom" type="button">Свой</button>
        </div>

        <div class="field-row double">
          <label class="field">
            <span>Смен</span>
            <input id="customShifts" type="number" min="0" value="4" />
          </label>
          <label class="field">
            <span>Выходных</span>
            <input id="customDaysOff" type="number" min="0" value="3" />
          </label>
        </div>

        <label class="field">
          <span>Дата старта</span>
          <input id="graphStartDate" type="date" />
        </label>

        <div class="field-row double">
          <label class="field">
            <span>До конца месяца</span>
            <input id="graphEndMonth" type="checkbox" checked />
          </label>
          <label class="field">
            <span>До конца недели</span>
            <input id="graphEndWeek" type="checkbox" />
          </label>
        </div>

        <label class="field">
          <span>Часов за смену</span>
          <input id="graphShiftHours" type="number" min="1" step="0.5" value="8" />
        </label>

        <button class="primary-action gradient-btn" id="applyGraphBtn" type="button">Применить</button>
      </div>
    </aside>

    <aside id="workModal" class="modal hidden" aria-hidden="true">
      <div class="modal-panel glass-panel">
        <div class="sheet-header">
          <div>
            <div class="eyebrow">Работа</div>
            <h3 id="workModalTitle">Добавить работу</h3>
          </div>
          <button class="close-sheet" id="closeWorkModal" type="button" aria-label="Закрыть">×</button>
        </div>

        <form id="workForm" class="modal-form">
          <label class="field">
            <span>Название</span>
            <input id="workNameInput" type="text" maxlength="28" placeholder="Ночная смена" />
          </label>

          <div class="field-row double">
            <label class="field">
              <span>Цвет</span>
              <input id="workColorInput" type="color" value="#7dd3fc" />
            </label>
            <label class="field">
              <span>Валюта</span>
              <select id="workCurrencyInput">
                <option value="₽">₽</option>
                <option value="$">$</option>
                <option value="€">€</option>
                <option value="₸">₸</option>
                <option value="₴">₴</option>
                <option value="¥">¥</option>
                <option value="£">£</option>
              </select>
            </label>
          </div>

          <div class="segmented" id="workTypeToggle">
            <button class="segment active" data-type="hourly" type="button">Почасовая</button>
            <button class="segment" data-type="fixed" type="button">Фиксированная</button>
          </div>

          <label class="field">
            <span>Ставка</span>
            <input id="workRateInput" type="number" min="0" step="50" value="400" />
          </label>

          <div class="modal-actions">
            <button class="danger-btn hidden" id="deleteWorkBtn" type="button">Удалить</button>
            <button class="primary-action" type="submit">Сохранить</button>
          </div>
        </form>
      </div>
    </aside>
  </body>

  <script src="app.js"></script>
</html>
